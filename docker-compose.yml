services:
  scylla:
    image: scylladb/scylla:latest
    ports:
      - "9042:9042"
      - "9160:9160"
      - "9180:9180"
    volumes:
      - scylla-data:/var/lib/scylla
    environment:
      - SCYLLA_CLUSTER_NAME=MyCluster
      - SCYLLA_LISTEN_ADDRESS=auto
      - SCYLLA_BROADCAST_ADDRESS=auto
      - SCYLLA_RPC_ADDRESS=auto
      - SCYLLA_BROADCAST_RPC_ADDRESS=auto

volumes:
  scylla-data: