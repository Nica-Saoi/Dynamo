services:
  scylladb:
    image: scylladb/scylla:6.2
    container_name: dynamo-scylladb
    restart: unless-stopped

    ports:
      - "127.0.0.1:9042:9042"

    volumes:
      - scylla_data:/var/lib/scylla

    command:
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - "1"
      - --developer-mode
      - "1"

volumes:
  scylla_data: